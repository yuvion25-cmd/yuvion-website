<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>YUVION | The Beginning</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

</head>

<body>

<div class="background"></div>
<div class="overlay"></div>

<header>

    <img src="C:\Users\YUVI\Desktop\YUVION Countdown\logo.png.jpeg" class="logo"> 

</header>

<section class="hero">

    <p class="small-title">
        THE COUNTDOWN BEGINS
    </p>

    <h1>
        08 • 03 • 2027
    </h1>

    <h2>
        THE BEGINNING
    </h2>

    <p class="description">

        Every step.
        Every decision.
        Every sacrifice.

        Leads to one beginning.

    </p>

</section>

<section class="countdown">

    <div class="card">
        <h3 id="days">000</h3>
        <span>DAYS</span>
    </div>

    <div class="card">
        <h3 id="hours">00</h3>
        <span>HOURS</span>
    </div>

    <div class="card">
        <h3 id="minutes">00</h3>
        <span>MINUTES</span>
    </div>

    <div class="card">
        <h3 id="seconds">00</h3>
        <span>SECONDS</span>
    </div>

</section>

<section class="waitlist">

    <h2>

        Join The Waiting List

    </h2>

    <p>

        Be among the first to experience YUVION.

    </p>

    <form>

        <input
        type="email"
        placeholder="Enter your email"
        required>

        <button>

            Notify Me

        </button>

    </form>

</section>

<section class="social">

    <a href="https://Instagram.com/yuvion.official">Instagram</a>

</section>

<footer>

    <p>

        © 2026 YUVION

    </p>

    <p>

        MOVE BEYOND

    </p>

</footer>
